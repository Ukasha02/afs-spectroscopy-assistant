afs_pathway:
  src: "S02 p.20; S05 p.1"
  steps:
    - "1. Multi-method lab trials with the multi-spectral fiber system"
    - "2. Identify key spectral features"
    - "3. Choose a path"
  paths:
    A: "Chemometric model: spectral data to real-time concentration for process automation"
    B: "Customized multi-spectral fiber system for R&D in the customer's own lab"
    C: "Customized IoT spectral fiber sensors for volume process control"

rules:
  # General rules. 'applies_when' is a hint for the pre-analysis and the model, not a case trigger.
  - id: fluorescence_needs_fluorophore
    statement: "Fluorescence only measures a defined fluorescent species or a justified indicator; most chemicals do not fluoresce."
    applies_when: "fluorescence is proposed or requested"
    src: "S01 p.5; S04 p.4; DOCX §5"
  - id: sensitivity_not_selectivity
    statement: "High sensitivity does not imply selectivity. Fluorimetry and UV/Vis are rated high sensitivity but low selectivity."
    applies_when: "a method is justified by its sensitivity"
    src: "S01 Table 1 (p.6); DOCX §5"
  - id: calibration_matrix_specific
    statement: "Chemometric calibrations are specific to the matrix; a change of API, excipients or formulation can invalidate them."
    applies_when: "reuse or transfer of an existing calibration or model; a new product or formulation"
    src: "S01 p.10; DOCX §5"
  - id: optical_density_not_viability
    statement: "Turbidity / optical density tracks cell density but is not a viable cell count."
    applies_when: "biomass, viable cells or growth are targets"
    src: "S01 p.16; DOCX §5"
  - id: evidence_scope
    statement: "A published application or a laboratory / in-vitro study is a reason to test a method, not proof that it works for a new customer, a process, or clinical use."
    applies_when: "the client cites a study or application as proof; clinical, in-vivo or production readiness is claimed"
    src: "DOCX §3; S03 p.3, p.10, p.14"
  - id: nominal_range_not_instrument_range
    statement: "A nominal method range is not the usable range of a specific instrument, fiber or probe."
    applies_when: "a spectral range is stated"
    src: "DOCX §3; DOCX §5"
  - id: combination_is_hypothesis
    statement: "Combining methods can add complementary information, but the gain is a hypothesis to test against the best single method."
    applies_when: "two or more methods are considered"
    src: "S01 p.7-8; DOCX §5"
  - id: fiber_limits_wavelength
    statement: "The fiber determines which wavelengths reach the probe. Silica fibers transmit up to about 2.4 um and cannot carry mid-IR; mid-IR needs chalcogenide, polycrystalline or hollow-waveguide fibers."
    applies_when: "a fiber link, remote analyzer, or reuse of existing fiber is mentioned; MIR is considered"
    src: "S02 p.6; S04 p.1; DOCX §5"
  - id: remote_measurement_nir_silica
    statement: "NIR works with standard glass optics and silica fibers, which suits remote online measurement; robust silica cables of 100-300 m exist."
    applies_when: "the analyzer must be far from the measuring point"
    src: "S01 p.5; S02 p.7"
  - id: raman_fluorescence_background
    statement: "Raman can be swamped by fluorescence background from many organic compounds; check signal quality first."
    applies_when: "Raman is considered for organic or biological samples"
    src: "S01 p.11"
  - id: geometry_follows_optics
    statement: "Clear liquids suit transmission or transflection; opaque, concentrated or powder samples suit diffuse reflection; highly absorbing or 'black' liquids suit ATR."
    applies_when: "choosing a probe geometry; optical properties vary between streams or over time"
    src: "S01 Table 1 (p.6); S01 p.16; S01 p.17-18"
  - id: same_spot_for_heterogeneous
    statement: "For heterogeneous or fast-changing samples, methods should measure the same spot at the same time, e.g. with a combi probe."
    applies_when: "sample is heterogeneous (tissue, powders) or changes fast and more than one method is used"
    src: "S01 p.8; S04 p.2"
  - id: simplify_after_lab
    statement: "Full-spectrum lab work identifies the few informative wavelengths; a simple few-wavelength sensor can then be adequate in production."
    applies_when: "planning scale-up or a production sensor"
    src: "S01 p.9; S02 p.4; S03 p.2; S04 p.4"
  - id: do_not_invent
    statement: "Do not invent measured results, accuracy, detection limits, response times, fiber lengths, product codes or prices, client facts, or guarantees."
    applies_when: "always"
    src: "DOCX §3"
  - id: insufficient_information_is_valid
    statement: "If the known facts cannot justify a method choice, say so, ask the deciding questions and propose the next step."
    applies_when: "target, matrix or contaminant is undefined"
    src: "DOCX §3"
