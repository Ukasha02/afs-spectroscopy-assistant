# Curated facts and general rules from the AFS materials, written by the team.
# - Short paraphrases with citations in the format the assistant uses (S01 p.10, S02 p.6, DOCX §3).
# - Drives the deterministic pre-analysis (rules.py) and is shown to the model next to the corpus.
# - General domain knowledge only. Nothing here may be specific to an evaluation case.
# - Wavelengths are stored in micrometres (um); display strings keep the source's own units.

sources:
  # Scope of each source. A source may only be cited within its scope (prompt rule + verifier check).
  S01: {scope: "Overview of optical methods, measurement kits and application cases (medical, pharma, bioprocess, dairy) from a laboratory/system integrator", evidence: "main technical source; application cases are reasons to test, not proof for a new customer", technical: true}
  S02: {scope: "AFS slides on in-line process control: fiber types and ranges, probes, industrial application examples (water in petroleum, polymer extrusion), combi probes, architectures", evidence: "technical source; application slides are examples, not validated performance for a new customer", technical: true}
  S03: {scope: "Research paper: LED-based NIR sensor for kidney tumor diagnostics, in vitro (ex vivo) samples, 14 samples from 7 patients", evidence: "in-vitro medical proof of concept only; not evidence for in-vivo or clinical readiness, nor for industrial processes", technical: true}
  S04: {scope: "Research paper: combined MIR-ATR + fluorescence fiber probe, demonstrated on model biological tissues (chicken) and test liquids in the laboratory", evidence: "laboratory demonstration on model tissues; not evidence for clinical use or for a specific industrial process", technical: true}
  S05: {scope: "AFS company flyer", evidence: "business context only; not evidence of technical performance", technical: false}
  S06: {scope: "Link to the laboratory website", evidence: "business context only", technical: false}
  TABLE: {scope: "S01 Table 1 (p.6): qualitative ratings of methods and measurement techniques", evidence: "qualitative ratings from the source, not measured values or product specs", technical: true}
  DOCX: {scope: "Challenge reference: answer structure, good practice, method overview, worked examples D01/D02", evidence: "guidance on answer quality and a method overview compiled from the sources", technical: true}

methods:
  - id: NIR
    name: NIR spectroscopy
    table_method: NIR spectroscopy
    range_um: [0.78, 2.5]
    range_display: "780-2500 nm (nominal method range)"
    range_src: S01 p.10
    physics: overtone and combination bands of molecular vibrations (-OH, -NH, -CH)
    strengths:
      - "Penetrates up to several millimetres even into dense solids; ordinary glass optics and lamps; ideal for online and remote measurement via fiber probes [S01 p.5]"
      - "Most common online method with fiber probes; diffuse reflectance allows measurement without contact, at a distance [S01 p.10]"
    limitations:
      - "Broad overlapping bands; needs chemometrics for quantitative analysis [S01 p.10]"
      - "Calibration is matrix-specific; physical variation (particle size, temperature, scattering) changes the signal [DOCX §5]"
      - "May lack sensitivity for trace compounds below about 0.1 percent [S01 p.16]"
    typical_samples: "powders, dairy; diffuse reflection for scattering samples, transmission/transflection for clear liquids [DOCX §5; S01 p.17-18]"

  - id: MIR
    name: MIR (FTIR) spectroscopy, usually ATR
    table_method: IR spectroscopy
    range_um: [2.5, 25.0]
    range_display: "4000-400 cm-1 (2.5-25 um)"
    range_src: S01 p.9
    physics: fundamental molecular vibrations; well-defined absorption bands
    strengths:
      - "One of the most informative methods; high extinction coefficients, highly sensitive [S01 p.9]"
      - "High selectivity [S01 Table 1 (p.6)]"
      - "ATR fiber probes allow analysis of liquids and soft solids at a distance from the spectrometer [S01 p.10]"
    limitations:
      - "Strong absorption limits transmission to very thin samples (usually below 50 um); hence ATR [S01 p.5]"
      - "ATR samples only about 1-6 um deep; contact, fouling and chemical compatibility matter [S01 Table 1 (p.6); DOCX §5]"
      - "Needs mid-IR fibers (chalcogenide or polycrystalline silver halide), not silica [S04 p.1; S02 p.6]"
      - "Water absorbs strongly in the IR compared with Raman [S01 p.16]"
    typical_samples: "liquids, pastes, soft solids in contact with the ATR crystal; leads: water in petroleum, API in polymer extrusion [DOCX §5; S02 p.13-14]"

  - id: RAMAN
    name: Raman spectroscopy
    table_method: Raman spectroscopy
    range_um: [0.4, 1.1]
    range_display: "Raman shift in cm-1; signal recorded in the visible / short-wave NIR (400-1100 nm); state the laser excitation separately"
    range_src: S01 p.11
    physics: inelastic scattering of laser light by molecular vibrations
    strengths:
      - "High selectivity [S01 Table 1 (p.6)]; complementary to MIR (some bands appear in only one of the two) [S01 p.11]"
      - "Low water absorbance, well suited to aqueous media [S01 p.16]"
      - "Signal linear with concentration over a wide range; supports calibration models [S01 p.12]"
    limitations:
      - "Weak signal; fluorescence background can dominate for many organic compounds [S01 p.11]"
      - "High cost [S01 Table 1 (p.6)]"
      - "Calibration specific to the matrix [DOCX §5]"
    typical_samples: "powders and liquids; pharmaceutical blends (785 nm excitation example), bioprocess metabolites [S01 p.15-16]"

  - id: FLUO
    name: Fluorescence spectroscopy (fluorimetry)
    table_method: Fluorimetry
    range_um: [0.19, 0.74]
    range_display: "UV/Vis excitation and emission; depends on the fluorescent species"
    range_src: S01 p.12
    physics: emission after electronic excitation, shifted to longer wavelength
    strengths:
      - "High sensitivity [S01 Table 1 (p.6)]; nM-uM detection of cofactors and amino acids such as NADH, tryptophan, riboflavin [S01 p.16]"
      - "Key method for online analysis of biotechnological processes [S01 p.12]"
    limitations:
      - "Low selectivity [S01 Table 1 (p.6)]"
      - "Most chemicals do not fluoresce; mainly used in medicine, biology, biotechnology [S01 p.5]"
      - "Only for a defined fluorescent species or a justified indicator; not a direct measurement of every analyte [DOCX §5]"
    typical_samples: "liquids and solids containing a fluorescent component [S01 Table 1 (p.6); S04 p.4]"

  - id: UVVIS
    name: UV/Vis spectroscopy
    table_method: UV/Visible spectroscopy
    range_um: [0.19, 0.74]
    range_display: "UV 190-360 nm and visible; depends on target and setup"
    range_src: S01 p.5
    physics: electronic transitions (absorption)
    strengths:
      - "Very high sensitivity, especially in the UV [S01 p.5]; low cost [S01 Table 1 (p.6)]"
      - "Low-cost, robust real-time biomass trend via turbidity [S01 p.16]"
    limitations:
      - "Strong overlap of signals in mixtures; chemometrics needed [S01 p.5]; low selectivity [S01 Table 1 (p.6)]"
      - "Optical density is not a viable cell count [DOCX §5]"
    typical_samples: "defined absorbers; cell suspensions; probe choice by optical density: transmission/transflection for clear, UV-ATR for opaque or 'black' fluids [S01 p.16]"

fibers:
  # S02 p.6 (figure; values as transcribed in DOCX §5). Check the figure before relying on exact numbers.
  - {id: UV_SILICA, name: "UV-Vis silica fiber (standard or Al/Cu-coated)", range_um: [0.19, 1.2], src: S02 p.6}
  - {id: VISNIR_SILICA, name: "Vis-NIR silica fiber (standard or Al/Cu-coated)", range_um: [0.35, 2.4], src: S02 p.6}
  - {id: CIR, name: "Chalcogenide As-S IR fiber (CIR)", range_um: [1.1, 6.5], src: S02 p.6}
  - {id: PIR, name: "Polycrystalline silver halide IR fiber (PIR)", range_um: [3.0, 17.0], src: S02 p.6}
  - {id: HWG, name: "Hollow glass waveguide (HWG)", range_um: [2.0, 18.0], src: S02 p.6, note: "Low NA, poor coupling to FTIR compared with PIR [S02 p.10]"}
  - {id: INF3, name: "Indium fluoride fiber", range_um: [0.3, 5.5], src: S02 p.6}
  - {id: ZRF4, name: "Zirconium fluoride fiber", range_um: [0.3, 4.5], src: S02 p.6}

fiber_facts:
  - "Robust 100-300 m cables with low-OH silica fibers enable remote industrial process control [S02 p.7]"
  - "Al/Cu-coated silica fibers: high temperature resistance, hermetic, no polymer-jacket fluorescence for Raman and fluorescence [S02 p.7]"
  - "PIR fibers: 3-16 um, flexible, non-brittle, non-toxic, best coupling with FTIR [S02 p.8, p.10]"
  - "No link lengths for CIR, PIR or HWG fibers are given in the materials: ask, do not state one."

probes:
  - {id: ATR, name: "ATR probe (e.g. diamond or ZrO2 tip)", samples: "liquid, paste, soft solid", depth: "MIR 1-6 um; UV 0.1-1 um", src: "S01 Table 1 (p.6); S02 p.13"}
  - {id: DIFFUSE_REFLECTION, name: "Diffuse reflection probe (Reflex / DRS)", samples: "scattering media, powder, solid", depth: "NIR 0.5-1 mm", src: "S01 Table 1 (p.6); S02 p.11"}
  - {id: TRANSMISSION, name: "Transmission or transflection probe (TransFlex)", samples: "liquid, colloidal", depth: "1-10 mm path", src: "S01 Table 1 (p.6); S01 p.18"}
  - {id: RAMAN_PROBE, name: "Raman fiber probe", samples: "liquid, powder, solid", depth: "2-5 mm", src: "S01 Table 1 (p.6); S01 p.12"}
  - {id: FLUO_PROBE, name: "Fluorescence fiber probe", samples: "liquid, solid", depth: "1-5 mm", src: "S01 Table 1 (p.6); S01 p.12"}
  - {id: COMBI, name: "Combi probe (same measurement spot)", samples: "heterogeneous or fast-changing samples", depth: "per method", src: "S01 p.8, p.14-15; S02 p.15-16; S04 p.2", note: "MIR-ATR + fluorescence and MIR-ATR + Raman demonstrated; NIR + Raman for feed frame; a four-method probe is under development [S01 p.8]"}

sample_state_map:
  # Extraction classifies the sample; Table 1 sample_type values that fit each class.
  clear_liquid: ["liquid", "colloidal"]
  turbid_liquid: ["liquid", "colloidal", "scattering media"]
  opaque_liquid: ["scattering media", "liquid"]
  paste_or_soft_solid: ["paste", "soft"]
  powder: ["powder", "scattering media"]
  solid: ["solid", "solid film", "pill"]
  tissue: ["soft", "solid"]
  gas: []
  unknown: []

